name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://assetmov:assetmov_dev_only_change_me@127.0.0.1:3307/assetmov
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: Validate database schema
        run: npm run db:validate

      - name: Run lint
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run backend unit tests
        run: npm test

      - name: Build frontend and backend
        run: npm run build
